name: Maintenance Cron

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --import tsx scripts/operational-health.ts require-env DATABASE_URL

      - name: Run maintenance cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAINTENANCE_CONNECTORS: ${{ vars.MAINTENANCE_CONNECTORS }}
          MAINTENANCE_SCORECARD_PATH: .codex/telemetry/maintenance-scorecards.ndjson
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: |
          CONNECTORS="${MAINTENANCE_CONNECTORS:-docs}"
          npm run maintenance:run -- --incremental --connectors "$CONNECTORS"

      - name: Upload maintenance scorecard artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maintenance-scorecards
          path: .codex/telemetry/maintenance-scorecards.ndjson
          if-no-files-found: error
