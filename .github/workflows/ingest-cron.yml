name: Ingestion Health Check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required configuration
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://stakeholder-portal-ten.vercel.app' }}
        run: node --import tsx scripts/operational-health.ts require-env CRON_SECRET DEPLOY_URL

      - name: Run ingestion health check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://stakeholder-portal-ten.vercel.app' }}
          INGESTION_MAX_AGE_HOURS: ${{ vars.INGESTION_MAX_AGE_HOURS || '168' }}
          INGESTION_MAX_STALE_CHUNKS: ${{ vars.INGESTION_MAX_STALE_CHUNKS || '1000' }}
          INGESTION_MAX_STALE_CURSORS: ${{ vars.INGESTION_MAX_STALE_CURSORS || '5' }}
        run: |
          response_file="$(mktemp)"
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --request POST \
            -H "x-cron-secret: ${CRON_SECRET}" \
            --output "$response_file" \
            "${DEPLOY_URL}/api/cron/ingest"
          node --import tsx scripts/operational-health.ts assert-ingestion < "$response_file"
